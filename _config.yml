# Site identity
name: "sarbull"
title: "sarbull"
tagline: "Web development tutorials and notes"
description: "Practical web development notes by sarbull on JavaScript, CSS, Ruby on Rails, WordPress, and deploying applications with Dokku."
url: "https://sarbull.github.io"
baseurl: ""
lang: "en"
locale: "en_US"
timezone: "Europe/Bucharest"

author:
  name: "sarbull"
  type: "Person"
  url: "https://sarbull.github.io/about/"
twitter:
  username: "sarbull"
  card: "summary_large_image"
social:
  name: "sarbull"
  links:
    - "https://github.com/sarbull"

# Keep existing article addresses stable.
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter_opts:
    disable: true

nav:
  - name: "Articles"
    href: "/"
  - name: "About"
    href: "/about/"
  - name: "RSS"
    href: "/feed.xml"

sass:
  style: :compressed

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "sarbull"
      comments: true
      seo:
        type: "BlogPosting"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# These development files should never become public site content.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
