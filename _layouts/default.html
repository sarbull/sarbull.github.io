<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.noindex %}
  <meta name="robots" content="noindex, follow">
  {% else %}
  <meta name="robots" content="index, follow, max-image-preview:large">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,300i,600&amp;display=swap">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% if page.layout == 'post' %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/stackoverflow-light.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="{{ '/assets/js/post.js' | relative_url }}"></script>
  {% endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.name | escape }} RSS feed" href="{{ '/feed.xml' | absolute_url }}">
  {% seo %}
  {% if page.url == '/about/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": {{ '/about/#author' | absolute_url | jsonify }},
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/about/' | absolute_url | jsonify }},
    "sameAs": {{ site.social.links | jsonify }}
  }
  </script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="container">
    {{ content }}
    <footer class="site-footer">
      <a href="{{ '/about/' | relative_url }}">About {{ site.name | escape }}</a>
      <a href="https://github.com/sarbull" rel="me">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
    </footer>
  </div>
</body>
</html>
